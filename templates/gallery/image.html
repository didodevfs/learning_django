{% extends 'gallery/base.html' %}
{% load static %}
{% block content %}
            <section class="conteudo">
                <section class="imagem">
                    <div class="imagem__conteudo">
                        {% if photograph.photo == '' or photograph.photo == null %}
                        <img class="imagem__imagem" src="{% static '/assets/imagens/galeria/not-found.png' %}">
                        {% else %}
                        <img class="imagem__imagem" src="{{ photograph.photo.url }}">
                        {% endif %}
                        <div class="imagem__info">
                            <div class="imagem__texto">
                                <p class="imagem__titulo">{{ photograph.name }}</p>
                                <p class="imagem__descricao">{{ photograph.description }}</p>
                                <p class="imagem__texto"></p>
                            </div>
                        </div>
                    </div>
                </section>
            </section>
        </main>
    </div>
{% endblock %}
